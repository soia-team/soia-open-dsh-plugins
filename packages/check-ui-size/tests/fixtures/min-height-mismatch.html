<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>min-height mismatch fixture</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      /*
       * Reproduces the case this tool exists for: the declaration says 27px, the
       * laid-out box is 34px, because the child wins over min-height. A checker
       * that reads the declaration would report 27 and pass; only the rendered
       * box shows 34.
       */
      #btn {
        min-height: 27px;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        padding: 0;
        font-size: 14px;
      }

      #btn > .child {
        display: block;
        width: 10px;
        height: 34px;
      }

      /* Zero-sized and not rendered, for the visible=false branch. */
      #ghost {
        display: none;
        height: 10px;
      }
    </style>
  </head>
  <body>
    <div id="btn"><span class="child"></span></div>
    <div id="ghost"></div>
  </body>
</html>
